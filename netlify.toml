# netlify.toml
# Place this in the root of your Netlify-deployed repo.

[build]
  functions = "netlify/functions"
  publish    = "."          # static HTML files are in root

# Functions need the HTML templates in the bundle so the SSR functions can
# read them at runtime. render-clinic.js reads clinic.html; render-devices.js
# reads devices.html. A template missing from this list makes the function
# throw at cold start and every URL it serves returns 503.
[functions]
  included_files = ["clinic.html", "devices.html"]


# ── CANONICAL HOMEPAGE ───────────────────────────────────────────
# Redirect /index.html to / so the duplicate path stops competing in search.
[[redirects]]
  from   = "/index.html"
  to     = "/"
  status = 301
  force  = true


[[redirects]]
  from   = "/devices.html"
  to     = "/devices/"
  status = 301
  force  = true


# ── STUDIO + VISUALIZE MOVED TO SKINDAY.COM (M3 migration) ───────
# Studio and Visualize now live on the global site. These forward any old
# skinday.ca links/bookmarks to the new home.
# force = true is REQUIRED: the old studio.html / visualize.html files still
# exist in this repo, and without force Netlify serves the static file
# instead of redirecting.
# Now 301 (permanent): migration to skinday.com confirmed stable, so search
# engines should pass authority to the new URLs and drop the old ones.
[[redirects]]
  from   = "/studio"
  to     = "https://skinday.com/studio.html"
  status = 301
  force  = true

[[redirects]]
  from   = "/studio.html"
  to     = "https://skinday.com/studio.html"
  status = 301
  force  = true

[[redirects]]
  from   = "/visualize"
  to     = "https://skinday.com/visualize.html"
  status = 301
  force  = true

[[redirects]]
  from   = "/visualize.html"
  to     = "https://skinday.com/visualize.html"
  status = 301
  force  = true


