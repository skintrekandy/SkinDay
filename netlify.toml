# ── DYNAMIC SITEMAP ──────────────────────────────────────────────
# Serves live clinic slugs from Supabase instead of the stale static file.
# `force = true` ensures this overrides any leftover static sitemap.xml.
#
# ⚠️ TODO (M39): netlify/functions/sitemap.js does not yet emit the device URLs.
# /devices/ and every /devices/{model} slug need adding, or the new pages are
# only discoverable through the footer link and will index slowly.
[[redirects]]
  from   = "/sitemap.xml"
  to     = "/.netlify/functions/sitemap"
  status = 200
  force  = true
