  status = 200


# ── LEGACY CLINIC SLUG REDIRECTS ─────────────────────────────────
# One-off 301s for clinic slugs that changed. MUST stay above the
# /clinic/* catch-all below: Netlify matches top-to-bottom and the
# catch-all (force = true) would otherwise swallow these first.
#
# Q Esthetics had two locations sharing the slug q-esthetics-laser-clinic
# (a slug collision). Toronto (id 388) now owns -toronto and Richmond Hill
# (id 371) owns -richmond-hill. The old bare slug was the indexed Toronto
# URL and 1,598 requests were hitting it; send them to the Toronto page.
[[redirects]]
  from   = "/clinic/q-esthetics-laser-clinic"
  to     = "/clinic/q-esthetics-laser-clinic-toronto"
  status = 301
  force  = true

# Serene Rejuvenation (id 2673, Surrey BC) was listed as "Serene Rejuvenation
# @ CityMed". CityMed Medical Centre is only the building they rent in, not
# part of the business name, and the owner asked for it removed. Renaming the
# clinic re-fires trg_clinics_slug, so the slug moved to serene-rejuvenation
# and this preserves the indexed URL.
[[redirects]]
  from   = "/clinic/serene-rejuvenation-citymed"
  to     = "/clinic/serene-rejuvenation"
  status = 301
  force  = true


# ── CLINIC PAGES (SSR) ───────────────────────────────────────────
# Server-side render clinic profile pages so Google sees real <title>,
# meta description, and content baked into the HTML. The existing
# client-side JS still hydrates on top of the SSR output for users.
# `force = true` is required to override the static clinic.html file.
#
# Pass the slug both as a path splat AND a query param so the function
# can find it whichever way Netlify happens to populate event.
[[redirects]]
  from   = "/clinic/*"
  to     = "/.netlify/functions/render-clinic/:splat?slug=:splat"
  status = 200
  force  = true


# ── DEVICE PAGES (SSR, M39) ──────────────────────────────────────
# Server-side render /devices/ and /devices/{model} so Google sees the model
# name, the clinic count and the clinic list baked into the HTML. Without SSR
# every device URL would serve the same empty devices.html shell and the whole
# set would be treated as duplicates, exactly as happened with clinic pages.
#
# ⚠️ force = true is REQUIRED on all three, and not for the usual reason.
# devices.html sits in the repo root, and Netlify's automatic pretty-URL
# handling maps /devices.html to /devices, so WITHOUT force it would serve the
# empty static shell instead of calling the function. Same trap the studio
# redirects hit.
#
# The two exact paths must come BEFORE the splat rule: Netlify matches
# top-to-bottom, and /devices/* would otherwise swallow the bare index.
[[redirects]]
  from   = "/devices"
  to     = "/.netlify/functions/render-devices"
  status = 200
  force  = true

[[redirects]]
  from   = "/devices/"
  to     = "/.netlify/functions/render-devices"
  status = 200
  force  = true

# ── DEVICE x PROVINCE PAGES (SSR, M19.3) ─────────────────────────
# /devices/{model}/{province}  e.g. /devices/morpheus8/ontario
# /devices/sitemap.xml
#
# These sit UNDER the existing /devices/{model} pages deliberately. A separate
# /technology/ namespace would have been a second device URL family competing
# with this one for the same queries — the cannibalisation problem the one-
# grain-per-area rule exists to prevent. National page stays device-level;
# these add the province cut beneath it.
#
# Grain is PROVINCE for Canada, measured 2026-08-06: the metro cut gives 3,860
# thin combinations at 17 listings each because Canadian rows carry city, not
# metro. Province gives 261 pages at 40 listings each. Only combinations with
# 10+ clinics render; anything thinner returns a real 404.
#
# ⚠️ BOTH RULES MUST COME BEFORE /devices/* — Netlify matches top-to-bottom and
# the splat below would swallow them. Same trap the legacy clinic-slug 301s
# are guarded against further up this file.
# ⚠️ Do NOT map bare /devices or /devices/ here; that index belongs to
# render-devices.js.
[[redirects]]
  from   = "/devices/sitemap.xml"
  to     = "/.netlify/functions/device-page"
  status = 200
  force  = true

[[redirects]]
  from   = "/devices/:model/:province"
  to     = "/.netlify/functions/device-page"
  status = 200
  force  = true

# Slug passed as both a path splat and a query param, for the same reason as
# the clinic rule: whichever way Netlify populates the event, the function
# finds it.
[[redirects]]
  from   = "/devices/*"
  to     = "/.netlify/functions/render-devices/:splat?slug=:splat"
  status = 200
  force  = true


